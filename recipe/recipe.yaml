schema_version: 1

context:
  version: 1.10.1

package:
  name: bwidget
  version: ${{ version }}

source:
  # use a separate folder to avoid moving scripts generated by conda-build
  url: https://downloads.sourceforge.net/project/tcllib/BWidget/${{ version }}/bwidget-${{ version }}.tar.gz
  sha256: 4aea02f38cf92fa4aa44732d4ed98648df839e6537d6f0417c3fe18e1a34f880
  target_directory: src

build:
  number: 3

requirements:
  run:
    - tk

tests:
  - script:
      - if: linux
        then: xvfb-run tclsh test_bwidget.tcl ${{ version }}
        else: tclsh test_bwidget.tcl ${{ version }}
    files:
      recipe:
        - test_bwidget.tcl
    requirements:
      run:
        # there is no tcl package for win-arm64; its tk package ships tclsh itself
        - if: target_platform == "win-arm64"
          then: tk
          else: tcl

about:
  license: TCL
  license_file: src/LICENSE.txt
  summary: Simple Widgets for Tcl/Tk.
  homepage: http://www.tcl.tk/
  documentation: https://core.tcl-lang.org/bwidget/home

extra:
  recipe-maintainers:
    - fhoehle
