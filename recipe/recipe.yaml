schema_version: 1

context:
  version: 1.10.1

package:
  name: bwidget
  version: ${{ version }}

source:
  # use a separate folder to avoid moving scripts generated by conda-build
  url: https://downloads.sourceforge.net/project/tcllib/BWidget/${{ version }}/bwidget-${{ version }}.tar.gz
  sha256: 4aea02f38cf92fa4aa44732d4ed98648df839e6537d6f0417c3fe18e1a34f880
  target_directory: src

build:
  number: 1

requirements:
  run:
    - tk

tests:
  - script:
      - if: linux
        then: echo "if {[catch {package require -exact BWidget ${{ version }}; exit 0}]} {exit 1}" | xvfb-run tclsh
      - if: osx
        then: echo "if {[catch {package require -exact BWidget ${{ version }}; exit 0}]} {exit 1}" | tclsh
      - if: win
        then: echo package require BWidget;exit | tclsh --

about:
  license: TCL
  license_file: src/LICENSE.txt
  summary: Simple Widgets for Tcl/Tk.
  homepage: http://www.tcl.tk/
  documentation: https://core.tcl-lang.org/bwidget/home

extra:
  recipe-maintainers:
    - fhoehle
